<!doctype html><html><head><meta charset="utf-8"><title>Enterprise Operations Intelligence</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{font:16px Arial;background:#0b1324;color:#eef;padding:28px}.toolbar{display:flex;gap:12px;flex-wrap:wrap}select,input,button{padding:10px;border-radius:6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{background:#182642;padding:18px;border-radius:10px}.card b{display:block;font-size:25px;color:#61dafb}.panel{background:#14213d;padding:18px;margin-top:18px;border-radius:10px}canvas{max-height:320px}.note{color:#b8c7df}</style></head><body><h1>Enterprise Operations & Business Performance Intelligence</h1><p class="note">Interactive HTML dashboard (not Power BI) | Synthetic data, seed 42 | as-of 2026-07-01T00:00:00</p><div class="toolbar"><label>City <select id="city"><option>All</option><option>Bengaluru</option><option>Gurugram</option><option>Hyderabad</option><option>Pune</option><option>Mumbai</option></select></label><label>Scenario time improvement % <input id="improvement" type="number" min="0" max="40" value="15"></label><button id="reset">Reset filters</button></div><section id="cards" class="grid"></section><div class="panel"><h2>City performance</h2><canvas id="slaChart"></canvas></div><div class="panel"><h2>Decision support</h2><p id="scenario"></p><p class="note">Time released is not treated as cash saving; only avoided overtime is monetised, less implementation cost.</p></div><script>const d={"kpis": {"total_requests": 500000, "closed_requests": 497839, "sla_compliance_pct": 74.6, "avg_turnaround_hours": 40.47, "backlog": 2161, "backlog_overdue": 488, "operating_cost_inr": 1771885897.13, "estimated_remaining_cost_inr": 3643917.67, "avg_quality_score": 91.24}, "by_city": {"Pune": {"n": 99570, "breaches": 22300, "cost": 344708732.109999, "hours": 3914462, "sla_compliance_pct": 77.6, "avg_hours": 39.31, "cost_inr": 344708732.11}, "Mumbai": {"n": 99665, "breaches": 22636, "cost": 345660452.8499974, "hours": 3925567, "sla_compliance_pct": 77.29, "avg_hours": 39.39, "cost_inr": 345660452.85}, "Gurugram": {"n": 99736, "breaches": 36487, "cost": 390388680.20000124, "hours": 4452867, "sla_compliance_pct": 63.42, "avg_hours": 44.65, "cost_inr": 390388680.2}, "Bengaluru": {"n": 99447, "breaches": 22478, "cost": 345096054.7600001, "hours": 3922559, "sla_compliance_pct": 77.4, "avg_hours": 39.44, "cost_inr": 345096054.76}, "Hyderabad": {"n": 99421, "breaches": 22526, "cost": 346031977.20999956, "hours": 3930929, "sla_compliance_pct": 77.34, "avg_hours": 39.54, "cost_inr": 346031977.21}}, "scenario": {"intervention": "Capacity-aware 15% processing-time improvement for Gurugram Payments Operations", "baseline_workload_hours": 20146384, "productive_capacity_hours": 32800.0, "baseline_overtime_hours": 20113584.0, "revised_overtime_hours": 17091626.4, "overtime_cost_avoided_inr": 392854488.0, "implementation_cost_inr": 250000, "net_modelled_opportunity_inr": 392604488.0, "payback_months": 0.01}};const money=x=>'₹'+Math.round(x).toLocaleString('en-IN');let chart;function render(){let city=document.getElementById('city').value, k=d.kpis, rows=Object.entries(d.by_city).filter(([c])=>city==='All'||c===city);let total=rows.reduce((s,[,v])=>s+v.n,0),cost=rows.reduce((s,[,v])=>s+v.cost_inr,0),sla=rows.reduce((s,[,v])=>s+v.n*v.sla_compliance_pct,0)/Math.max(1,total);document.getElementById('cards').innerHTML=[['Total requests',city==='All'?k.total_requests:total],['SLA compliance',sla.toFixed(2)+'%'],['Backlog',k.backlog],['Overdue backlog',k.backlog_overdue],['Cost per completed',money(cost/Math.max(1,total))],['Quality score',k.avg_quality_score+'/100']].map(x=>'<div class="card"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join('');let labels=rows.map(x=>x[0]),vals=rows.map(x=>x[1].sla_compliance_pct);if(chart)chart.destroy();chart=new Chart(document.getElementById('slaChart'),{type:'bar',data:{labels,datasets:[{label:'SLA compliance %',data:vals,backgroundColor:'#61dafb'}]},options:{scales:{y:{beginAtZero:true,max:100}}}});let imp=Number(document.getElementById('improvement').value)/100;let revised=Math.max(0,d.scenario.baseline_overtime_hours-d.scenario.baseline_workload_hours*imp);let avoided=(d.scenario.baseline_overtime_hours-revised)*130;document.getElementById('scenario').textContent='Revised overtime: '+revised.toFixed(0)+' hours | Avoided overtime cost: '+money(avoided)+' | Net modelled opportunity after ₹250,000 implementation cost: '+money(avoided-250000)+' | Payback: '+(250000/Math.max(1,avoided/12)).toFixed(1)+' months';}document.getElementById('city').onchange=render;document.getElementById('improvement').oninput=render;document.getElementById('reset').onclick=()=>{document.getElementById('city').value='All';document.getElementById('improvement').value=15;render()};render();</script></body></html>
